name: Oto test kapısı

# Her push/PR'de koşar: biçim + derleme + ölü-kod + bağımlılık +
# güvenlik/lisans + tam test turu. Kırmızıysa birleştirme yok.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libasound2-dev pkg-config build-essential cmake libclang-dev curl ca-certificates git python3 file aria2 ffmpeg mpv libmpv-dev xvfb xauth binutils libgl1-mesa-dri libegl-mesa0 desktop-file-utils
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bookworm-check

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Metainfo sürümü (Cargo.toml ile aynı)
        run: python3 packaging/update-metainfo.py --check

      - name: Clippy (all targets, errors fail)
        run: cargo clippy --release --all-targets --message-format=short 2>&1 | tee /tmp/clippy.log; test ${PIPESTATUS[0]} -eq 0

      - name: Dead-code gate (unused code fails)
        run: |
          RUSTFLAGS="-D dead-code" cargo test --release --bin animecix --no-run
          RUSTFLAGS="-D dead-code" cargo test --release --bin animecix-calendar --no-run

      - name: Unused dependencies (machete)
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo machete

      - name: Security + licenses (deny)
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny check

      - name: Unit + integration tests
        run: |
          xvfb-run -a cargo test --release --bin animecix -- --test-threads=1
          cargo test --release --bin animecix-calendar
          cargo test --release --test refcell_guard --test next_episode --test follow_daemon

      - name: Yayın takipçisi smoke (GTK'sız)
        run: |
          cargo build --release --bin animecix-calendar
          ! ldd target/release/animecix-calendar | grep -Eq 'libgtk|libadwaita'
          target/release/animecix-calendar --check
          target/release/animecix-calendar --print-autostart > /tmp/animecix-calendar.desktop
          desktop-file-validate /tmp/animecix-calendar.desktop

      - name: Embedded player smoke (libmpv + GLArea)
        run: |
          cargo build --release --bin animecix
          LIBMPV=$(ldconfig -p | awk '/libmpv\.so\.2 /{print $NF; exit}')
          test -n "$LIBMPV"
          ffmpeg -y -f lavfi -i testsrc=size=320x180:rate=24 -t 2 -pix_fmt yuv420p /tmp/animecix-smoke.mp4 >/dev/null 2>&1
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ANIMECIX_LIBMPV_PATH="$LIBMPV" ./target/release/animecix --check-libmpv
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ANIMECIX_LIBMPV_PATH="$LIBMPV" ./target/release/animecix --player-smoke /tmp/animecix-smoke.mp4

      - name: Skip harness (mpv stamp logic)
        run: python3 tests/skip_harness.py

      - name: Flatpak updater contract (fake flatpak-spawn)
        run: python3 tests/flatpak_updater.py

  coverage:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev libasound2-dev pkg-config build-essential cmake libclang-dev curl ca-certificates git python3 file aria2 ffmpeg mpv libmpv-dev xvfb xauth binutils libgl1-mesa-dri libegl-mesa0 desktop-file-utils
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bookworm-cov

      # Satır kapsamı tabanı: şu an ~%33, gerileme kırmızı verir.
      - name: Coverage (bin unit tests)
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          xvfb-run -a cargo llvm-cov --release --bin animecix --fail-under-lines 30 -- --test-threads=1
