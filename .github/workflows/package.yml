name: Paketle (deb/rpm + ekran görüntüleri)

# Akış: vTAG kaynağından CI'da derler (glibc 2.36 tabanı = Debian 12),
# thin deb/rpm üretip aynı release'e ekler. Neden kaynaktan?
# Release AppImage'ındaki binary bakımcı makinesinde derlenir (glibc 2.38+),
# Ubuntu 22.04/Debian 12'de çalışmaz. Dağıtım paketi = dağıtım tabanında derleme.
# Destek: Debian 12+, Ubuntu 24.04+, Fedora 40+ (thin: sistem mpv/GTK kullanır).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (örn. v1.2.6)"
        required: true
        default: "v1.2.6"
  release:
    types: [published]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  derle:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Etiketi çöz
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && { echo "TAG çözülemedi"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
          echo "Çözülen etiket: $TAG"

      # Kod: tetiklenen ref (dispatch→main ucu, release olayı→etiket).
      # TAG (sürüm adı) ayrı çözülür; sürüm kontrolü aşağıda tag==Cargo.toml yapar.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Sistem bağımlılıkları
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config build-essential cmake libclang-dev curl ca-certificates git file
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bookworm-paket

      - name: Sürüm kontrolü (tag == Cargo.toml)
        run: |
          VER_TOML=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          echo "tag=$VER cargo=$VER_TOML"
          [ "$VER" = "$VER_TOML" ] || { echo "Etiket v$VER != Cargo.toml $VER_TOML"; exit 1; }

      - name: Derle
        run: cargo build --release --locked

      - name: glibc taban kontrolü (<= 2.36)
        run: |
          MAXGLIBC=$(objdump -T target/release/animecix | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
          echo "max glibc: $MAXGLIBC"
          TOP=$(printf '%s\nGLIBC_2.36\n' "$MAXGLIBC" | sort -Vu | tail -1)
          [ "$TOP" = "GLIBC_2.36" ] || { echo "glibc tabanı kaydı: $MAXGLIBC (deb Debian 12'de kurulmaz)"; exit 1; }

      - name: Girdiyi hazırla ve paylaş
        run: |
          mkdir -p girdi/usr/bin girdi/usr/share/applications
          cp target/release/animecix girdi/usr/bin/
          chmod +x girdi/usr/bin/animecix
          cat > girdi/usr/share/applications/tr.com.animecix.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=AnimeciX
          Comment=Anime, dizi ve film izleme istemcisi
          Exec=animecix
          Icon=tr.com.animecix
          Terminal=false
          Categories=AudioVideo;Player;Video;
          EOF
          for s in 64 128 256 512; do
            mkdir -p "girdi/usr/share/icons/hicolor/${s}x${s}/apps"
            cp "assets/icon-${s}.png" "girdi/usr/share/icons/hicolor/${s}x${s}/apps/tr.com.animecix.png"
          done
          # Gömülü Adwaita seti (60 SVG): sistemde Adwaita yoksa bile ikonlar çalışır.
          mkdir -p girdi/usr/share/animecix/assets
          cp -r assets/hicolor girdi/usr/share/animecix/assets/
          cp assets/ATTRIBUTION-Adwaita.md girdi/usr/share/animecix/ || true
          echo "$VER" > girdi/VER
          find girdi -type f | sort

      - name: Girdiyi paylaş
        uses: actions/upload-artifact@v4
        with:
          name: paket-girdi
          path: girdi/

  deb:
    needs: derle
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paket-girdi
          path: girdi

      - name: Paket iskeleti
        run: |
          VER=$(cat girdi/VER)
          echo "VER=$VER" >> "$GITHUB_ENV"
          P=pkg
          mkdir -p "$P/DEBIAN"
          cp -r girdi/usr "$P/"
          # upload-artifact çalıştırma iznini düşürür; pakette +x şart.
          chmod +x "$P/usr/bin/animecix"
          cat > "$P/DEBIAN/control" <<EOF
          Package: animecix
          Version: $VER
          Architecture: amd64
          Maintainer: veilzon
          Depends: mpv, libgtk-4-1, libadwaita-1-0, aria2
          Section: video
          Priority: optional
          Description: Anime, dizi ve film izleme istemcisi (GTK4, thin: sistem mpv kullanır)
           Harici mpv + sistem GTK ile çalışan ince paket. Debian 12+ / Ubuntu 24.04+ gerekir.
          EOF
          dpkg-deb --build "$P" "animecix_${VER}_amd64.deb"
          ls -la animecix_${VER}_amd64.deb

      - name: Kurulum testi (temiz Debian 12)
        run: |
          VER=$(cat girdi/VER)
          apt-get update -qq
          apt-get install -y "./animecix_${VER}_amd64.deb" desktop-file-utils xvfb gh
          desktop-file-validate /usr/share/applications/tr.com.animecix.desktop
          xvfb-run -a animecix --check-icons
          rm -rf /var/lib/apt/lists/*

      - name: Deb'i paylaş (ekran job'u için)
        uses: actions/upload-artifact@v4
        with:
          name: animecix-deb
          path: animecix_*_amd64.deb

      - name: Release'e yükle
        run: |
          VER=$(cat girdi/VER)
          TAG="v$VER"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "animecix_${VER}_amd64.deb" --clobber

  rpm:
    needs: derle
    runs-on: ubuntu-22.04
    container:
      image: fedora:40
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paket-girdi
          path: girdi

      - name: Araçlar
        run: dnf install -y rpm-build gh desktop-file-utils xorg-x11-server-Xvfb gtk4 libadwaita aria2

      - name: RPM derle (thin)
        run: |
          VER=$(cat girdi/VER)
          echo "VER=$VER" >> "$GITHUB_ENV"
          # iskele dizini doğrudan buildroot olur: %files'taki mutlak yollar bunun altına çözülür.
          mkdir -p "$PWD/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          mkdir -p iskele
          cp -r girdi/usr iskele/
          chmod +x iskele/usr/bin/animecix
          find iskele -type f | sort
          cat > "$PWD/rpmbuild/SPECS/animecix.spec" <<EOF
          Name: animecix
          Version: $VER
          Release: 1%{?dist}
          Summary: Anime, dizi ve film izleme istemcisi (GTK4, thin)
          License: MIT
          Requires: mpv, gtk4, libadwaita, aria2
          %define debug_package %{nil}
          %description
          Harici mpv + sistem GTK ile calisan ince paket.
          %files
          /usr/bin/animecix
          /usr/share/applications/tr.com.animecix.desktop
          /usr/share/icons/hicolor/*/apps/tr.com.animecix.png
          /usr/share/animecix
          EOF
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --buildroot "$PWD/iskele" "$PWD/rpmbuild/SPECS/animecix.spec"
          find "$PWD/rpmbuild/RPMS" -name '*.rpm' -exec cp {} ./ \;
          ls -la ./animecix-*.x86_64.rpm

      - name: Kurulum testi (rpmfusion + mpv)
        run: |
          RPM=$(ls ./animecix-*.x86_64.rpm | head -n 1)
          echo "RPM=$RPM"
          # Kanonik URL: mirrors.rpmfusion.org yönlendirmesi ölü aynaya
          # (repos.eggycrew.com, DNS yok) düşüyordu.
          dnf install -y "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf install -y "./$RPM"
          desktop-file-validate /usr/share/applications/tr.com.animecix.desktop
          xvfb-run -a animecix --check-icons

      - name: Release'e yükle
        run: |
          VER=$(cat girdi/VER)
          TAG="v$VER"
          RPM=$(ls ./animecix-*.x86_64.rpm | head -n 1)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$RPM" --clobber
          ls -lh ./animecix-*.x86_64.rpm

  ekran:
    # Release AppImage'ı bakımcı makinesinde derlenir (glibc 2.43+), CI
    # koşucularında açılmaz. O yüzden ekran, CI'ın kurduğu deb'ten alınır.
    needs: deb
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: animecix-deb
          path: deb

      - name: Deb'i kur
        run: |
          DEB=$(ls deb/animecix_*_amd64.deb | head -n 1)
          echo "DEB=$DEB"
          sudo apt-get update -qq
          sudo apt-get install -y "./$DEB" xvfb scrot
          which animecix

      - name: Sayfaları çek (home, settings, downloads)
        run: |
          # Tek Xvfb elle yönetilir; xvfb-run -a ... & + ayrı scrot DISPLAY kopukluğu yapar.
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          export GDK_BACKEND=x11
          sleep 2
          for sayfa in home settings downloads; do
            animecix --goto="$sayfa" &
            APP_PID=$!
            sleep 15
            scrot "ss-$sayfa.png" || echo "$sayfa çekilemedi"
            kill $APP_PID || true
            wait $APP_PID || true
            sleep 2
          done
          kill $XVFB_PID || true
          ls -la ss-*.png
          file ss-*.png
          for f in ss-*.png; do
            SZ=$(stat -c%s "$f")
            echo "$f: $SZ bayt"
            [ "$SZ" -gt 10000 ] || { echo "$f çok küçük, boş ekran olabilir"; exit 1; }
          done

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: ss-*.png
