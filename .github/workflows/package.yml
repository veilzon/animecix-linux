name: Paketle (deb/rpm + ekran görüntüleri)

# Akış: release AppImage'ını indirip içinden çıkan ikiliyle thin deb/rpm üretir,
# aynı release'e ekler. Bakımcı AppImage'ı release'e geç yüklerse dispatch ile
# elle tetiklenir (tag girdisi). Gelecek sürümlerde release yayınlanınca
# otomatik koşar (AppImage geç gelirse indirme adımı bekler).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (örn. v1.2.6)"
        required: true
        default: "v1.2.6"
  release:
    types: [published]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  hazirla:
    runs-on: ubuntu-22.04
    steps:
      - name: Etiketi çöz
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && { echo "TAG çözülemedi"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"
          echo "Çözülen etiket: $TAG"

      - name: AppImage'ı release'den indir (beklemeli)
        run: |
          for i in $(seq 1 10); do
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'AnimeciX-x86_64.AppImage' --clobber && break
            echo "AppImage henüz release'e eklenmemiş, 30sn bekleniyor ($i/10) TAG=$TAG"
            sleep 30
          done
          test -f AnimeciX-x86_64.AppImage
          ls -lh AnimeciX-x86_64.AppImage

      - name: Çıkar ve doğrula
        run: |
          chmod +x AnimeciX-x86_64.AppImage
          ./AnimeciX-x86_64.AppImage --appimage-extract
          test -x squashfs-root/usr/bin/animecix
          test -f squashfs-root/tr.com.animecix.desktop
          echo "$VER" > VER

      - name: Girdiyi paylaş
        uses: actions/upload-artifact@v4
        with:
          name: paket-girdi
          path: |
            squashfs-root/usr/bin/animecix
            squashfs-root/tr.com.animecix.desktop
            VER

  deb:
    needs: hazirla
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paket-girdi
          path: girdi

      - name: Checkout (ikonlar için)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: kaynak
          sparse-checkout: |
            assets/icon-64.png
            assets/icon-128.png
            assets/icon-256.png
            assets/icon-512.png
          sparse-checkout-cone-mode: false

      - name: Paket iskeleti
        run: |
          VER=$(cat girdi/VER)
          echo "VER=$VER" >> "$GITHUB_ENV"
          P=pkg
          mkdir -p "$P/DEBIAN" "$P/usr/bin" "$P/usr/share/applications"
          for s in 64 128 256 512; do
            mkdir -p "$P/usr/share/icons/hicolor/${s}x${s}/apps"
            cp "kaynak/assets/icon-${s}.png" "$P/usr/share/icons/hicolor/${s}x${s}/apps/tr.com.animecix.png"
          done
          cp girdi/squashfs-root/usr/bin/animecix "$P/usr/bin/"
          chmod +x "$P/usr/bin/animecix"
          cp girdi/squashfs-root/tr.com.animecix.desktop "$P/usr/share/applications/"
          cat > "$P/DEBIAN/control" <<EOF
          Package: animecix
          Version: $VER
          Architecture: amd64
          Maintainer: veilzon
          Depends: mpv, libgtk-4-1, libadwaita-1-0, aria2
          Section: video
          Priority: optional
          Description: Anime, dizi ve film izleme istemcisi (GTK4, thin: sistem mpv kullanır)
           Harici mpv + sistem GTK ile çalışan ince paket.
          EOF
          dpkg-deb --build "$P" "animecix_${VER}_amd64.deb"

      - name: Kurulum testi (temiz bağımlılık)
        run: |
          VER=$(cat girdi/VER)
          sudo apt-get update -qq
          sudo apt-get install -y "./animecix_${VER}_amd64.deb" desktop-file-utils xvfb
          desktop-file-validate /usr/share/applications/tr.com.animecix.desktop
          xvfb-run -a animecix --check-icons

      - name: Release'e yükle
        run: |
          VER=$(cat girdi/VER)
          TAG="v$VER"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "animecix_${VER}_amd64.deb" --clobber
          ls -la "animecix_${VER}_amd64.deb"

  rpm:
    needs: hazirla
    runs-on: ubuntu-22.04
    container:
      image: fedora:40
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paket-girdi
          path: girdi

      - name: Checkout (ikonlar için)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: kaynak
          sparse-checkout: |
            assets/icon-64.png
            assets/icon-128.png
            assets/icon-256.png
            assets/icon-512.png
          sparse-checkout-cone-mode: false

      - name: Araçlar
        run: dnf install -y rpm-build gh desktop-file-utils xorg-x11-server-Xvfb gtk4 libadwaita aria2

      - name: RPM derle (thin)
        run: |
          VER=$(cat girdi/VER)
          echo "VER=$VER" >> "$GITHUB_ENV"
          TOP="$PWD/rpmbuild"
          mkdir -p "$TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS} iskele/usr/bin iskele/usr/share/applications
          for s in 64 128 256 512; do
            mkdir -p "iskele/usr/share/icons/hicolor/${s}x${s}/apps"
            cp "kaynak/assets/icon-${s}.png" "iskele/usr/share/icons/hicolor/${s}x${s}/apps/tr.com.animecix.png"
          done
          cp girdi/squashfs-root/usr/bin/animecix iskele/usr/bin/
          cp girdi/squashfs-root/tr.com.animecix.desktop iskele/usr/share/applications/
          cat > "$TOP/SPECS/animecix.spec" <<EOF
          Name: animecix
          Version: $VER
          Release: 1%{?dist}
          Summary: Anime, dizi ve film izleme istemcisi (GTK4, thin)
          License: MIT
          Requires: mpv, gtk4, libadwaita, aria2
          %define debug_package %{nil}
          %description
          Harici mpv + sistem GTK ile calisan ince paket.
          %files
          /usr/bin/animecix
          /usr/share/applications/tr.com.animecix.desktop
          /usr/share/icons/hicolor/*/apps/tr.com.animecix.png
          EOF
          cp -r iskele/usr "$TOP/BUILD/"
          rpmbuild -bb --define "_topdir $TOP" --buildroot "$TOP/BUILDROOT" "$TOP/SPECS/animecix.spec"
          find "$TOP/RPMS" -name '*.rpm' -exec cp {} ./ \;
          ls -la ./animecix-*.x86_64.rpm

      - name: Kurulum testi (rpmfusion + mpv)
        run: |
          RPM=$(ls ./animecix-*.x86_64.rpm | head -n 1)
          echo "RPM=$RPM"
          dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf install -y "./$RPM"
          desktop-file-validate /usr/share/applications/tr.com.animecix.desktop
          xvfb-run -a animecix --check-icons

      - name: Release'e yükle
        run: |
          VER=$(cat girdi/VER)
          TAG="v$VER"
          RPM=$(ls ./animecix-*.x86_64.rpm | head -n 1)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$RPM" --clobber
          ls -lh ./animecix-*.x86_64.rpm

  ekran:
    needs: hazirla
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Etiketi çöz
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${{ github.event.release.tag_name }}"
          [ -z "$TAG" ] && TAG="${{ github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: AppImage'ı release'den indir
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'AnimeciX-x86_64.AppImage' --clobber
          chmod +x AnimeciX-x86_64.AppImage
          ./AnimeciX-x86_64.AppImage --appimage-extract

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-1 libadwaita-1-0 mpv aria2 xvfb scrot

      - name: Sayfaları çek (home, settings, downloads)
        run: |
          # Tek Xvfb elle yönetilir; xvfb-run -a ... & + ayrı scrot DISPLAY kopukluğu yapar.
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          export GDK_BACKEND=x11
          sleep 2
          for sayfa in home settings downloads; do
            ./squashfs-root/AppRun --goto="$sayfa" &
            APP_PID=$!
            sleep 15
            scrot "ss-$sayfa.png" || echo "$sayfa çekilemedi"
            kill $APP_PID || true
            wait $APP_PID || true
            sleep 2
          done
          kill $XVFB_PID || true
          ls -la ss-*.png
          file ss-*.png
          for f in ss-*.png; do
            SZ=$(stat -c%s "$f")
            echo "$f: $SZ bayt"
            [ "$SZ" -gt 10000 ] || { echo "$f çok küçük, boş ekran olabilir"; exit 1; }
          done

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: ss-*.png
