name: Release build (AppImage)

# Tag push'unda AppImage'ı CI'da üretir, test eder ve taslak release'e
# yükler. Release'in yayınlanması ayrı adımdır; yayınlanınca package.yml
# deb/rpm paketlerini aynı release'e ekler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config build-essential cmake libclang-dev curl ca-certificates git python3 file aria2 ffmpeg mpv xvfb xauth binutils libtool libgnutls28-dev nettle-dev libgmp-dev libp11-kit-dev zlib1g-dev libidn2-dev libunistring-dev libtasn1-6-dev libffi-dev
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bookworm

      - name: Version check (tag == Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG cargo=$VER"
          [ "$TAG" = "$VER" ] || { echo "Tag v$TAG != Cargo.toml $VER"; exit 1; }

      - name: Metainfo sürümü (Cargo.toml ile aynı)
        run: python3 packaging/update-metainfo.py --check

      - name: Tests
        run: |
          xvfb-run -a cargo test --release --bin animecix -- --test-threads=1
          python3 tests/skip_harness.py

      - name: Build release binary
        run: cargo build --release --locked

      - name: Shader check
        run: ./target/release/animecix --check-shaders

      - name: Build AppImage (minimal aria2, no version bump)
        run: GITHUB_TOKEN= VERSION_BUMP=none GITHUB_REPO=veilzon/animecix-linux ANIMECIX_MINIMAL_ARIA2=1 bash build_appimage.sh

      - name: Verify artifacts
        run: |
          ls -la AnimeciX-x86_64.AppImage
          test ! "$(ldd target/release/animecix | grep 'not found' || true)"
          MAXGLIBC=$(objdump -T target/release/animecix | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
          echo "max glibc: $MAXGLIBC"
          TOP=$(printf '%s\nGLIBC_2.36\n' "$MAXGLIBC" | sort -Vu | tail -1)
          [ "$TOP" = "GLIBC_2.36" ] || { echo "glibc baseline kaydı: $MAXGLIBC"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animecix-build
          path: AnimeciX-x86_64.AppImage

  upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: animecix-build

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "AnimeciX $TAG" --notes "Otomatik derleme."
          fi
          gh release upload "$TAG" AnimeciX-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
