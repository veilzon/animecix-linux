name: Release build (AppImage)

# Sürüm akışı yereldir: release AppImage'ı bakımcının makinesinde üretilip
# `gh release upload` ile yüklenir. Bu workflow tag/main'de derleyip test
# ederek kodun AppImage üretebilir kaldığını garanti eder; release
# sayfasına dokunmaz (publish adımı bilerek yoktur).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config build-essential cmake libclang-dev curl ca-certificates git python3 file aria2 ffmpeg mpv xvfb xauth binutils
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bookworm

      - name: Version check (tag == Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG cargo=$VER"
          [ "$TAG" = "$VER" ] || { echo "Tag v$TAG != Cargo.toml $VER"; exit 1; }

      - name: Tests
        run: |
          xvfb-run -a cargo test --release --bin animecix
          python3 tests/skip_harness.py

      - name: Build release binary
        run: cargo build --release --locked

      - name: Shader check
        run: ./target/release/animecix --check-shaders

      - name: Build AppImage (thin, no version bump)
        run: GITHUB_TOKEN= VERSION_BUMP=none GITHUB_REPO=veilzon/animecix-linux bash build_appimage.sh

      - name: Verify artifacts
        run: |
          ls -la AnimeciX-x86_64.AppImage
          test ! "$(ldd target/release/animecix | grep 'not found' || true)"
          MAXGLIBC=$(objdump -T target/release/animecix | grep -oE 'GLIBC_2\.[0-9]+' | sort -Vu | tail -1)
          echo "max glibc: $MAXGLIBC"
          TOP=$(printf '%s\nGLIBC_2.36\n' "$MAXGLIBC" | sort -Vu | tail -1)
          [ "$TOP" = "GLIBC_2.36" ] || { echo "glibc baseline kaydı: $MAXGLIBC"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animecix-build
          path: AnimeciX-x86_64.AppImage
