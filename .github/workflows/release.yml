name: Release build (AppImage + .deb)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config build-essential curl aria2 ffmpeg mpv desktop-file-utils appstream dpkg-dev

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Version check (tag == Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 '^version =' Cargo.toml | cut -d'"' -f2)
          echo "tag=$TAG cargo=$VER"
          [ "$TAG" = "$VER" ] || { echo "Tag v$TAG != Cargo.toml $VER"; exit 1; }

      - name: Tests
        run: |
          cargo test --release --bin animecix
          python3 tests/skip_harness.py

      - name: Build release binary
        run: cargo build --release --locked

      - name: Shader check
        run: ./target/release/animecix --check-shaders

      - name: Build AppImage (thin, no version bump)
        # GITHUB_TOKEN bilerek verilmiyor: script içindeki publish_release
        # atlanır, publish işini aşağıdaki release adımı tek elden yapar.
        run: GITHUB_TOKEN= VERSION_BUMP=none GITHUB_REPO=veilzon/animecix-linux bash build_appimage.sh

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb -- --locked

      - name: Verify artifacts
        run: |
          ls -la AnimeciX-x86_64.AppImage target/debian/*.deb
          test ! "$(ldd target/release/animecix | grep 'not found' || true)"
          dpkg-deb --info target/debian/*.deb
          dpkg-deb --contents target/debian/*.deb
          desktop-file-validate packaging/arch/animecix.desktop

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AnimeciX-x86_64.AppImage
            target/debian/*.deb
          body: |
            Kurulum (Debian/Ubuntu): sudo apt install ./animecix_*_amd64.deb
            Kurulum (diğer): chmod +x AnimeciX-x86_64.AppImage && ./AnimeciX-x86_64.AppImage
            Gerekenler: mpv, aria2, curl.
            AppImage yeni sürümü açılışta kendisi indirir; .deb kullananlar apt ile günceller.

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: animecix-build
          path: |
            AnimeciX-x86_64.AppImage
            target/debian/*.deb
