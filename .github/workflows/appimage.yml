name: AppImage build (CI)

# AppImage yalnızca CI'da üretilir. Debian 12 tabanı (glibc 2.36) daha yeni
# dağıtımlarda geniş uyumluluk sağlar; minimal aria2 ile gereksiz libler
# pakete girmez.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: appimage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config build-essential cmake libclang-dev curl ca-certificates git python3 python3-pip file ffmpeg mpv libmpv-dev patchelf xvfb xauth binutils libtool libfuse2 libgl1-mesa-dri libegl-mesa0 libgnutls28-dev nettle-dev libgmp-dev libp11-kit-dev zlib1g-dev libidn2-dev libunistring-dev libtasn1-6-dev libffi-dev meson ninja-build nasm yasm libass-dev libfontconfig1-dev libfreetype-dev libharfbuzz-dev libfribidi-dev libunibreak-dev libdav1d-dev libpulse-dev libegl-dev libgl-dev libxkbcommon-dev desktop-file-utils
          rm -rf /var/lib/apt/lists/*
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bookworm-appimage

      - name: Meson (>= 1.3)
        run: python3 -m pip install --break-system-packages "meson==1.3.2"

      - name: Cache minimal libmpv
        uses: actions/cache@v4
        with:
          path: target/minimal-libmpv
          key: minimal-libmpv-${{ runner.os }}-${{ hashFiles('packaging/build-minimal-libmpv.sh') }}

      - name: Build minimal libmpv
        run: bash packaging/build-minimal-libmpv.sh

      - name: Build AppImage (minimal aria2)
        run: MINIMAL_LIBMPV_DIR=target/minimal-libmpv GITHUB_TOKEN= VERSION_BUMP=none GITHUB_REPO=veilzon/animecix-linux ANIMECIX_MINIMAL_ARIA2=1 bash build_appimage.sh

      - name: Smoke test
        run: |
          rm -rf squashfs-root
          ./AnimeciX-x86_64.AppImage --appimage-extract >/dev/null
          export APPDIR="$PWD/squashfs-root"
          test -e "$APPDIR/usr/lib/libmpv.so.2"
          test -e "$APPDIR/usr/share/animecix/assets/changelog/ekrangoruntusu.mp4"
          for bad in libicudata libtesseract libflite liblpcnetfreedv librav1e libSvtAv1Enc; do
            ! ls "$APPDIR/usr/lib/$bad"* >/dev/null 2>&1
          done
          for icon in go-previous-symbolic go-next-symbolic media-playback-start-symbolic \
            media-playback-pause-symbolic media-playback-stop-symbolic media-skip-forward-symbolic \
            audio-volume-high-symbolic audio-volume-low-symbolic audio-volume-medium-symbolic \
            audio-volume-muted-symbolic view-fullscreen-symbolic view-restore-symbolic \
            camera-photo-symbolic dialog-information-symbolic folder-download-symbolic; do
            test -f "$APPDIR/usr/share/icons/Adwaita/symbolic/actions/$icon.svg"
          done
          ! ldd "$APPDIR/usr/lib/libmpv.so.2" | grep 'not found'
          test -x "$APPDIR/usr/bin/animecix-calendar"
          ! ldd "$APPDIR/usr/bin/animecix-calendar" | grep -Eq 'libgtk|libadwaita'
          "$APPDIR/usr/bin/animecix-calendar" --check
          "$APPDIR/usr/bin/animecix-calendar" --print-autostart > /tmp/animecix-calendar.desktop
          desktop-file-validate /tmp/animecix-calendar.desktop
          HOME=$(mktemp -d) "$APPDIR/AppRun" --calendar-once --dry-run
          xvfb-run -a "$APPDIR/usr/bin/animecix" --check-shaders
          xvfb-run -a "$APPDIR/usr/bin/animecix" --check-libmpv
          ffmpeg -y -f lavfi -i testsrc=size=320x180:rate=24 -t 2 -pix_fmt yuv420p /tmp/animecix-smoke.mp4 >/dev/null 2>&1
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$APPDIR/usr/bin/animecix" --player-smoke /tmp/animecix-smoke.mp4
          ls -lh AnimeciX-x86_64.AppImage
          SIZE=$(stat -c%s AnimeciX-x86_64.AppImage)
          echo "AppImage boyut: $SIZE bayt"
          test "$SIZE" -lt 60000000
          sha256sum AnimeciX-x86_64.AppImage
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: animecix-appimage
          path: AnimeciX-x86_64.AppImage
