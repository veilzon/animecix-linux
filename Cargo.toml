[package]
name = "animecix"
version = "1.2.1"
edition = "2021"
description = "Türkçe anime izleme uygulaması (GTK4/libadwaita + mpv)"
homepage = "https://github.com/veilzon/animecix-linux"
repository = "https://github.com/veilzon/animecix-linux"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.8", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.6", features = ["v1_2"] }
glib = "0.19"
gio = "0.19"
gdk-pixbuf = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }
wreq = "=6.0.0-rc.31"
wreq-util = "=3.0.0-rc.14"
futures = "0.3"
tokio = { version = "1", features = ["rt", "net", "time"] }
libc = "0.2.189"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

[profile.release]
lto = true

[package.metadata.deb]
maintainer = "veilzon <veilzon@users.noreply.github.com>"
copyright = "2026, veilzon <veilzon@users.noreply.github.com>"
license-file = ["LICENSE", "0"]
depends = "libgtk-4-1 (>= 4.8), libadwaita-1-0 (>= 1.2), libglib2.0-0 (>= 2.66), mpv, aria2, xdg-utils, curl"
section = "video"
priority = "optional"
extended-description = "GTK4/libadwaita ile yazılmış Türkçe anime izleme istemcisi; oynatmayı mpv'ye devreder, çok bağlantılı indirme için aria2c kullanır."
assets = [
    ["target/release/animecix", "usr/bin/", "755"],
    ["packaging/arch/animecix.desktop", "usr/share/applications/animecix.desktop", "644"],
    ["packaging/flatpak/io.github.veilzon.AnimeciX.metainfo.xml", "usr/share/metainfo/io.github.veilzon.AnimeciX.metainfo.xml", "644"],
    ["assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/animecix.png", "644"],
    ["assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/animecix.png", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/animecix.png", "644"],
    ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/animecix.png", "644"],
    ["assets/upscale/*", "usr/share/animecix/assets/upscale/", "644"]
]
