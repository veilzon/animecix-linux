app-id: io.github.veilzon.AnimeciX
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: animecix
separate-locales: false
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  # İndirme yöneticisi kullanıcı seçtiği klasöre yazabilsin.
  - --filesystem=home
  # Discord RPC: native Discord ve Flatpak Discord/Vesktop soketleri.
  - --filesystem=xdg-run/app/com.discordapp.Discord
  - --filesystem=xdg-run/app/com.discordapp.DiscordCanary
  - --filesystem=xdg-run/.flatpak/dev.vencord.Vesktop/xdg-run
  - --filesystem=xdg-run/.flatpak/com.discordapp.Discord/xdg-run
  - --filesystem=xdg-run/.flatpak/com.discordapp.DiscordCanary/xdg-run
  - --filesystem=xdg-run/snap.discord
  - --filesystem=xdg-run/snap.discord-canary
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/discord-ipc-1
  - --filesystem=xdg-run/discord-ipc-2
  - --filesystem=xdg-run/discord-ipc-3
  - --filesystem=xdg-run/discord-ipc-4
  - --filesystem=xdg-run/discord-ipc-5
  - --filesystem=xdg-run/discord-ipc-6
  - --filesystem=xdg-run/discord-ipc-7
  - --filesystem=xdg-run/discord-ipc-8
  - --filesystem=xdg-run/discord-ipc-9
  # Uygulama içi Flatpak güncellemesi (flatpak-spawn --host) için.
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - /include
  - /lib/pkgconfig
  - '*.la'
modules:
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --enable-shared --disable-static --disable-doc --disable-programs --disable-avdevice --disable-postproc --disable-sdl2 --disable-vulkan --disable-ffnvcodec
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n6.1.1
        commit: e38092ef9395d7049f871ef4d5411eb410e283e0

  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
      # Meson'da release tek başına NDEBUG tanımlamaz; talloc'un hata
      # ayıklama kanaryası yüzünden mpv --version bile çöküyordu.
      - -Db_ndebug=if-release
      - -Dcplayer=true
      - -Dlibmpv=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Drubberband=disabled
      - -Dlibplacebo=disabled
      - -Dvulkan=disabled
      - -Dzimg=disabled
      - -Duchardet=disabled
      - -Dvapoursynth=disabled
      - -Dalsa=disabled
      - -Djack=disabled
      - -Dopenal=disabled
      - -Dsdl2=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.36.0
        commit: f4210f84906c3b00a65fba198c8127b6757b9350
      # m_option_value union'ının yalnızca ilk üyesini sıfırlayan `= {0}`
      # başlatması GCC 15/glibc 2.42'de çöp string pointer'ı bırakıp
      # mpv --version'da talloc_free çökmesine yol açıyor. Upstream 0.37
      # düzeltmesini (1805681aa) 0.36.0'a geri taşır.
      - type: patch
        path: mpv-0.36.0-m_option-value-default.patch

  - name: aria2
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-bittorrent
      - --disable-metalink
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b

  - name: animecix
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/animecix/cargo
        LIBCLANG_PATH: /usr/lib/sdk/llvm20/lib
    build-commands:
      - LLVM_STDDEF=$(find /usr/lib/sdk/llvm20 -name stddef.h | head -n1); LLVM_INC=${LLVM_STDDEF%/*}; [ -n "$LLVM_INC" ] || LLVM_INC=/usr/lib/sdk/llvm20/lib/clang/20/include; export BINDGEN_EXTRA_CLANG_ARGS="-I$LLVM_INC -I/usr/include -I/usr/include/x86_64-linux-gnu"; cargo build --release --offline --locked
      - install -Dm755 target/release/animecix -t /app/bin
      - install -Dm644 packaging/flatpak/io.github.veilzon.AnimeciX.desktop -t /app/share/applications/
      - install -Dm644 packaging/flatpak/io.github.veilzon.AnimeciX.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 assets/icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.veilzon.AnimeciX.png
      - install -Dm644 assets/icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.veilzon.AnimeciX.png
      - install -Dm644 assets/icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.veilzon.AnimeciX.png
      - install -Dm644 assets/icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.veilzon.AnimeciX.png
      # Uygulama içi ikon adı (tr.com.animecix) Flatpak'ta da bulunsun.
      - install -Dm644 assets/icon-64.png /app/share/icons/hicolor/64x64/apps/tr.com.animecix.png
      - install -Dm644 assets/icon-128.png /app/share/icons/hicolor/128x128/apps/tr.com.animecix.png
      - install -Dm644 assets/icon-256.png /app/share/icons/hicolor/256x256/apps/tr.com.animecix.png
      - install -Dm644 assets/icon-512.png /app/share/icons/hicolor/512x512/apps/tr.com.animecix.png
      - mkdir -p /app/share/animecix/assets
      - cp -r assets/upscale /app/share/animecix/assets/
      - cp -r assets/hicolor /app/share/animecix/assets/
      - install -Dm644 assets/ATTRIBUTION-Adwaita.md /app/share/animecix/ATTRIBUTION-Adwaita.md
      - chmod -R a-w /app/share/animecix/assets/upscale /app/share/animecix/assets/hicolor
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
